name: Web app and backend checks

permissions:
  contents: read

concurrency:
  group: filebridge-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build React web app
        working-directory: frontend
        run: npm run build
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit and integration tests
        run: python -m unittest discover -v

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build React web app
        working-directory: frontend
        run: npm run build
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit and integration tests
        run: python -m unittest discover -v

  publish-production-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build React web app
        working-directory: frontend
        run: npm run build
      - name: Commit production assets served by Python
        run: |
          if git diff --quiet -- filebridge/web; then
            echo "Production UI assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filebridge/web
          git commit -m "Build React production UI assets"
          git push
